<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>水流 · 写作台</title>
    <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">水流 <span>写作台</span></div>
      <div class="top-actions">
        <span class="dev-status" id="devStatus"><i></i>本地预览检测中</span>
        <a class="ghost" href="http://localhost:4321" target="_blank" rel="noreferrer" id="localLink">本地站点</a>
        <a class="ghost" href="https://first-blog-wine.vercel.app" target="_blank" rel="noreferrer">线上站点</a>
        <button class="primary" id="deployTop">发布上线</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <button class="nav active" data-tab="library">资料库</button>
        <button class="nav" data-tab="site">站点</button>
        <button class="nav" data-tab="jobs">操作与日志</button>
        <p class="hint">文件夹只是归类，不会改变已有文章的链接。改完点右上角「发布上线」。</p>
      </aside>

      <main>
        <section class="panel" id="panel-library">
          <div class="library-layout">
            <aside class="folder-pane">
              <div class="pane-head">
                <span>文件夹</span>
                <button class="mini" id="newFolder">+ 新建</button>
              </div>
              <div id="folderList" class="folder-list"></div>
            </aside>

            <div class="item-pane">
              <div class="panel-head">
                <div>
                  <p class="eyebrow">Library</p>
                  <h1 id="folderTitle">全部内容</h1>
                </div>
                <div class="head-actions">
                  <button class="ghost" id="newNote">新建笔记</button>
                  <button class="primary" id="uploadBtn">上传文件</button>
                </div>
              </div>

              <div class="drop-strip" id="dropZone">
                拖入文件到当前文件夹（PDF / Word / PPT / ZIP / Markdown，单文件 ≤ 50MB）
              </div>
              <input id="fileInput" type="file" multiple hidden />

              <div class="toolbar">
                <input id="itemSearch" type="search" placeholder="搜索当前文件夹" />
              </div>

              <div class="list" id="itemList"></div>

              <div class="editor hidden" id="postEditor">
                <div class="editor-head">
                  <button class="ghost" id="backToList">← 返回列表</button>
                  <div>
                    <button class="danger" id="deletePost">删除</button>
                    <button class="primary" id="savePost">保存</button>
                  </div>
                </div>

                <label class="field full">
                  <span>标题</span>
                  <input id="fTitle" type="text" />
                </label>

                <div class="grid">
                  <label class="field">
                    <span>文件夹</span>
                    <select id="fFolder"></select>
                  </label>
                  <label class="field">
                    <span>分类</span>
                    <input id="fCategory" type="text" placeholder="微积分Ⅰ" />
                  </label>
                  <label class="field">
                    <span>日期</span>
                    <input id="fDate" type="date" />
                  </label>
                  <label class="field">
                    <span>标签（逗号分隔）</span>
                    <input id="fTags" type="text" placeholder="极限, 第一章" />
                  </label>
                </div>

                <label class="field full">
                  <span>摘要</span>
                  <textarea id="fDescription" rows="2"></textarea>
                </label>

                <div class="editor-tools">
                  <span>正文（Markdown）</span>
                  <button class="ghost" id="togglePreview">预览</button>
                </div>
                <textarea id="fBody" class="body-editor" spellcheck="false"></textarea>
                <div class="preview hidden prose" id="preview"></div>
              </div>
            </div>
          </div>
        </section>

        <section class="panel hidden" id="panel-site">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Site</p>
              <h1>站点</h1>
            </div>
            <button class="primary" id="saveSettings">保存站点信息</button>
          </div>

          <div class="grid">
            <label class="field"><span>站名</span><input id="sName" type="text" /></label>
            <label class="field"><span>英文名</span><input id="sLatin" type="text" /></label>
            <label class="field"><span>浏览器标题</span><input id="sTitle" type="text" /></label>
            <label class="field"><span>作者</span><input id="sAuthor" type="text" /></label>
            <label class="field"><span>邮箱</span><input id="sEmail" type="email" /></label>
            <label class="field"><span>开始年份</span><input id="sYear" type="number" /></label>
            <label class="field"><span>首页标题第一行</span><input id="sHeroTitle" type="text" /></label>
            <label class="field"><span>首页标题第二行</span><input id="sHeroSubtitle" type="text" /></label>
          </div>

          <label class="field full"><span>站点简介</span><textarea id="sDescription" rows="2"></textarea></label>
          <label class="field full"><span>首页自我介绍（显示在标题右侧）</span><textarea id="sHomeIntro" rows="4"></textarea></label>
          <label class="field full"><span>页脚文案</span><input id="sFooter" type="text" /></label>
          <p class="hint">保存后，点「发布上线」才会更新线上。</p>

          <div class="section-divider"></div>

          <div class="panel-head compact">
            <div>
              <p class="eyebrow">About</p>
              <h1>关于页</h1>
            </div>
            <button class="primary" id="saveAbout">保存关于页</button>
          </div>

          <div class="grid">
            <label class="field"><span>页面标题</span><input id="aTitle" type="text" /></label>
            <label class="field"><span>页面摘要</span><input id="aDescription" type="text" /></label>
          </div>

          <div class="links-editor">
            <div class="pane-head"><span>链接</span><button class="mini" id="addLink">+ 添加链接</button></div>
            <div id="aboutLinks"></div>
          </div>

          <label class="field full"><span>关于页正文（Markdown）</span><textarea id="aBody" class="body-editor" spellcheck="false"></textarea></label>
        </section>

        <section class="panel hidden" id="panel-jobs">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Jobs</p>
              <h1>操作与日志</h1>
            </div>
          </div>

          <div class="job-actions">
            <button class="ghost" data-job="import">导入 inbox</button>
            <button class="ghost" data-job="build">只构建检查</button>
            <button class="primary" data-job="deploy">构建并发布</button>
          </div>

          <pre class="log" id="jobLog">等待操作…</pre>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" hidden></div>
    <script src="/admin.js" defer></script>
  </body>
</html>
